<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Budget Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f3f4f6; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="text-gray-800 antialiased p-6 max-w-5xl mx-auto">

    <header class="mb-8 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-900">Budget Tracker</h1>
        <button onclick="fetchData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Refresh Data</button>
    </header>

    <!-- Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="glass-card p-6 flex flex-col justify-center items-center">
            <h2 class="text-lg font-semibold text-gray-500">Total Income</h2>
            <p id="totalIncome" class="text-3xl font-bold text-green-600 mt-2">$0.00</p>
        </div>
        <div class="glass-card p-6 flex flex-col justify-center items-center">
            <h2 class="text-lg font-semibold text-gray-500">Total Expenses</h2>
            <p id="totalExpense" class="text-3xl font-bold text-red-600 mt-2">$0.00</p>
        </div>
    </div>

    <!-- Charts -->
    <div class="glass-card p-6 mb-8 w-full max-w-2xl mx-auto">
        <h2 class="text-xl font-bold mb-4 text-center">Expense Breakdown</h2>
        <canvas id="expenseChart"></canvas>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Add Transaction Form -->
        <div class="glass-card p-6">
            <h2 class="text-xl font-bold mb-4">Log Transaction</h2>
            <form id="transactionForm" class="flex flex-col gap-4">
                <input type="date" id="tDate" class="p-2 border rounded" required>
                <select id="tType" class="p-2 border rounded" onchange="updateCategoryDropdown()">
                    <option value="Expense">Expense</option>
                    <option value="Income">Income (e.g. Parents)</option>
                </select>
                <select id="tCategory" class="p-2 border rounded" required></select>
                <input type="number" id="tAmount" placeholder="Amount" class="p-2 border rounded" required>
                <input type="text" id="tNotes" placeholder="Notes (Optional)" class="p-2 border rounded">
                <button type="submit" class="bg-gray-900 text-white py-2 rounded mt-2 hover:bg-gray-800">Add Data</button>
            </form>
        </div>

        <!-- Add Category Form -->
        <div class="glass-card p-6">
            <h2 class="text-xl font-bold mb-4">New Category & Goal</h2>
            <form id="categoryForm" class="flex flex-col gap-4">
                <select id="cType" class="p-2 border rounded">
                    <option value="Expense">Expense Field</option>
                    <option value="Income">Income Source</option>
                </select>
                <input type="text" id="cName" placeholder="Category Name (e.g., Grocery)" class="p-2 border rounded" required>
                <input type="number" id="cGoal" placeholder="Monthly Goal / Limit" class="p-2 border rounded" required>
                <button type="submit" class="bg-gray-900 text-white py-2 rounded mt-2 hover:bg-gray-800">Create Field</button>
            </form>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const API_URL = 'https://script.google.com/macros/s/AKfycbyoYkZ5YAMsjfdhfKFoicyS7YylvNRF0uf9x1kc1TNDQtDil3pBdakjvddouA1nBmaB/exec';
        
        let globalCategories = [];
        let expenseChartInstance = null;

        async function fetchData() {
            const res = await fetch(API_URL);
            const data = await res.json();
            globalCategories = data.categories;
            updateCategoryDropdown();
            updateDashboard(data.transactions);
        }

        function updateCategoryDropdown() {
            const type = document.getElementById('tType').value;
            const dropdown = document.getElementById('tCategory');
            dropdown.innerHTML = globalCategories
                .filter(c => c.type === type)
                .map(c => `<option value="${c.name}">${c.name} (Limit: ${c.goal})</option>`)
                .join('');
        }

        function updateDashboard(transactions) {
            let totalInc = 0, totalExp = 0;
            let expenseBreakdown = {};

            transactions.forEach(t => {
                if (t.type === 'Income') totalInc += parseFloat(t.amount || 0);
                if (t.type === 'Expense') {
                    totalExp += parseFloat(t.amount || 0);
                    expenseBreakdown[t.category] = (expenseBreakdown[t.category] || 0) + parseFloat(t.amount || 0);
                }
            });

            document.getElementById('totalIncome').innerText = '$' + totalInc.toFixed(2);
            document.getElementById('totalExpense').innerText = '$' + totalExp.toFixed(2);

            // Update Chart
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChartInstance) expenseChartInstance.destroy();
            
            expenseChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseBreakdown),
                    datasets: [{
                        data: Object.values(expenseBreakdown),
                        backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6'],
                    }]
                }
            });
        }

        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'addTransaction',
                date: document.getElementById('tDate').value,
                type: document.getElementById('tType').value,
                category: document.getElementById('tCategory').value,
                amount: document.getElementById('tAmount').value,
                notes: document.getElementById('tNotes').value
            };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers:{ 'Content-Type': 'text/plain' } });
            e.target.reset();
            fetchData();
        });

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'addCategory',
                type: document.getElementById('cType').value,
                name: document.getElementById('cName').value,
                goal: document.getElementById('cGoal').value
            };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers:{ 'Content-Type': 'text/plain' } });
            e.target.reset();
            fetchData();
        });

        // Initial Load
        fetchData();
    </script>
</body>
</html>
