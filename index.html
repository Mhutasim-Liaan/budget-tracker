<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Budget Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-attachment: fixed;
            color: #f8fafc;
        }
        .glass-card { 
            background: rgba(15, 23, 42, 0.5); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        /* Smooth Form Inputs */
        input, select {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2) !important;
        }
        
        /* Dropdown options fix for dark mode */
        option { background-color: #1e293b; color: white; }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
    </style>
</head>
<body class="antialiased p-6 max-w-5xl mx-auto min-h-screen">

    <header class="mb-10 flex justify-between items-center animate-fade-up">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-emerald-400">Budget Tracker</h1>
            <p class="text-gray-400 mt-1 text-sm font-medium">Manage your finances seamlessly</p>
        </div>
        <button onclick="fetchData()" class="bg-sky-500/20 text-sky-400 border border-sky-500/50 px-5 py-2.5 rounded-xl hover:bg-sky-500/40 hover:scale-105 transition-all duration-300 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            Refresh
        </button>
    </header>

    <!-- Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="glass-card p-8 flex flex-col justify-center items-center animate-fade-up delay-100">
            <h2 class="text-sm uppercase tracking-wider font-semibold text-gray-400">Total Income</h2>
            <p id="totalIncome" class="text-4xl font-bold text-emerald-400 mt-2 tracking-tight">৳0.00</p>
        </div>
        <div class="glass-card p-8 flex flex-col justify-center items-center animate-fade-up delay-100">
            <h2 class="text-sm uppercase tracking-wider font-semibold text-gray-400">Total Expenses</h2>
            <p id="totalExpense" class="text-4xl font-bold text-rose-400 mt-2 tracking-tight">৳0.00</p>
        </div>
    </div>

    <!-- Charts -->
    <div class="glass-card p-8 mb-8 w-full max-w-2xl mx-auto animate-fade-up delay-200">
        <h2 class="text-xl font-bold mb-6 text-center text-gray-200">Expense Breakdown</h2>
        <div class="relative h-64 w-full flex justify-center">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fade-up delay-300">
        <!-- Add Transaction Form -->
        <div class="glass-card p-8">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <span class="bg-sky-500/20 p-2 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg></span>
                Log Transaction
            </h2>
            <form id="transactionForm" class="flex flex-col gap-4">
                <input type="date" id="tDate" class="p-3 rounded-xl" required>
                <select id="tType" class="p-3 rounded-xl" onchange="updateCategoryDropdown()">
                    <option value="Expense">Expense</option>
                    <option value="Income">Income (e.g. Parents)</option>
                </select>
                <select id="tCategory" class="p-3 rounded-xl" required></select>
                <input type="number" id="tAmount" placeholder="Amount (৳)" class="p-3 rounded-xl" required>
                <input type="text" id="tNotes" placeholder="Notes (Optional)" class="p-3 rounded-xl">
                <button type="submit" class="bg-gradient-to-r from-sky-500 to-indigo-500 text-white font-semibold py-3 rounded-xl mt-4 hover:opacity-90 hover:scale-[1.02] transition-all shadow-lg shadow-sky-500/30">Add Transaction</button>
            </form>
        </div>

        <!-- Add Category Form -->
        <div class="glass-card p-8">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <span class="bg-emerald-500/20 p-2 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/></svg></span>
                New Category & Goal
            </h2>
            <form id="categoryForm" class="flex flex-col gap-4">
                <select id="cType" class="p-3 rounded-xl">
                    <option value="Expense">Expense Field</option>
                    <option value="Income">Income Source</option>
                </select>
                <input type="text" id="cName" placeholder="Category Name (e.g., Grocery)" class="p-3 rounded-xl" required>
                <input type="number" id="cGoal" placeholder="Monthly Goal / Limit (৳)" class="p-3 rounded-xl" required>
                <button type="submit" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold py-3 rounded-xl mt-4 hover:opacity-90 hover:scale-[1.02] transition-all shadow-lg shadow-emerald-500/30">Create Field</button>
            </form>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const API_URL = 'https://script.google.com/macros/s/AKfycbyoYkZ5YAMsjfdhfKFoicyS7YylvNRF0uf9x1kc1TNDQtDil3pBdakjvddouA1nBmaB/exec';
        
        let globalCategories = [];
        let expenseChartInstance = null;

        // Configure Chart.js for Dark Mode globally
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                globalCategories = data.categories;
                updateCategoryDropdown();
                updateDashboard(data.transactions);
            } catch(e) {
                console.error("Error fetching data. Check API_URL.");
            }
        }

        function updateCategoryDropdown() {
            const type = document.getElementById('tType').value;
            const dropdown = document.getElementById('tCategory');
            dropdown.innerHTML = globalCategories
                .filter(c => c.type === type)
                .map(c => `<option value="${c.name}">${c.name} (Limit: ৳${c.goal})</option>`)
                .join('');
        }

        function updateDashboard(transactions) {
            let totalInc = 0, totalExp = 0;
            let expenseBreakdown = {};

            transactions.forEach(t => {
                if (t.type === 'Income') totalInc += parseFloat(t.amount || 0);
                if (t.type === 'Expense') {
                    totalExp += parseFloat(t.amount || 0);
                    expenseBreakdown[t.category] = (expenseBreakdown[t.category] || 0) + parseFloat(t.amount || 0);
                }
            });

            // Animate number counting effect for Taka
            animateValue("totalIncome", 0, totalInc, 1000);
            animateValue("totalExpense", 0, totalExp, 1000);

            // Update Chart with smooth animations
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChartInstance) expenseChartInstance.destroy();
            
            expenseChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseBreakdown),
                    datasets: [{
                        data: Object.values(expenseBreakdown),
                        backgroundColor: [
                            'rgba(56, 189, 248, 0.8)', // Sky
                            'rgba(244, 63, 94, 0.8)',  // Rose
                            'rgba(16, 185, 129, 0.8)', // Emerald
                            'rgba(245, 158, 11, 0.8)', // Amber
                            'rgba(139, 92, 246, 0.8)'  // Violet
                        ],
                        borderColor: 'rgba(15, 23, 42, 1)',
                        borderWidth: 2,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1200,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: { position: 'right' }
                    },
                    cutout: '70%'
                }
            });
        }

        // Helper function for smooth number counting
        function animateValue(id, start, end, duration) {
            if (start === end) return;
            let obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = '৳' + (progress * (end - start) + start).toFixed(2);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Saving...';
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const payload = {
                action: 'addTransaction',
                date: document.getElementById('tDate').value,
                type: document.getElementById('tType').value,
                category: document.getElementById('tCategory').value,
                amount: document.getElementById('tAmount').value,
                notes: document.getElementById('tNotes').value
            };
            
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers:{ 'Content-Type': 'text/plain' } });
            
            e.target.reset();
            btn.innerText = originalText;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            fetchData();
        });

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Creating...';
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const payload = {
                action: 'addCategory',
                type: document.getElementById('cType').value,
                name: document.getElementById('cName').value,
                goal: document.getElementById('cGoal').value
            };
            
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers:{ 'Content-Type': 'text/plain' } });
            
            e.target.reset();
            btn.innerText = originalText;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            fetchData();
        });

        // Set default date to today
        document.getElementById('tDate').valueAsDate = new Date();

        // Initial Load
        fetchData();
    </script>
</body>
</html><!DOCTYPE html>

                <button type="submit" class="bg-gray-900 text-white py-2 rounded mt-2 hover:bg-gray-800">Create Field</button>
